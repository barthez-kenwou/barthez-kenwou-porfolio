    <script>
      (function () {
        try {
          var raw = localStorage.getItem('frontend-starter-theme');
          var theme = 'dark';
          if (raw) {
            var parsed = JSON.parse(raw);
            var t = (parsed && parsed.state && parsed.state.theme) || (parsed && parsed.theme);
            if (t === 'light' || t === 'dark') theme = t;
          }
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
