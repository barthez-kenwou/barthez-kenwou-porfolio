name: CI

# PRs + develop - production push is covered by deploy-vps.yml
on:
  push:
    branches: [development, develop]
  pull_request:
    branches: [main, master, development, develop]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests (CI)
        run: bun run test:ci

      - name: Prepare .env for build
        run: cp .env.example .env

      - name: Build
        env:
          NODE_ENV: production
          VITE_SKIP_IMAGEMIN: 'true'
        run: bunx vite build

      - name: Upload dist (artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 5
