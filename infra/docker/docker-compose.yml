# =============================================================================
# Barthez Kenwou Portfolio - Compose (local build + GHCR / Watchtower ready)
# =============================================================================
#
# Local (build from source):
#   docker compose -f infra/docker/docker-compose.yml up -d --build
#   → http://localhost:${WEB_HOST_PORT:-8080}
#
# Local (host dist → runtime image):
#   bun install --frozen-lockfile && bun run build
#   DOCKERFILE=Dockerfile.runtime docker compose -f infra/docker/docker-compose.yml build web
#   docker compose -f infra/docker/docker-compose.yml up -d web
#
# Production VPS (pull from GHCR, Watchtower refreshes):
#   Create `.env` from `infra/docker/.env.example`, then:
#     docker compose pull web && docker compose up -d
#   Optional Watchtower:
#     docker compose --profile watchtower up -d
#
# Watchtower only updates containers with com.centurylinklabs.watchtower.enable=true
# =============================================================================

name: barthez-kenwou-portfolio

services:
  web:
    image: ${GHCR_IMAGE:-ghcr.io/barthez-kenwou/barthez-kenwou-porfolio}:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/${DOCKERFILE:-Dockerfile}
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${IMAGE_TAG:-latest}
        VITE_SITE_URL: ${VITE_SITE_URL:-https://barthez-kenwou.dev}
        VITE_APP_URL: ${VITE_APP_URL:-https://barthez-kenwou.dev}
        VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-production}
        VITE_ENABLE_PWA: ${VITE_ENABLE_PWA:-true}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-Barthez Kenwou Portfolio}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.barthez-kenwou.dev}
    container_name: barthez-portfolio-web
    restart: unless-stopped
    ports:
      # Local default 8080; on VPS set WEB_HOST_PORT=80 (edge TLS elsewhere)
      - '${WEB_HOST_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /tmp/nginx:mode=1777
      - /var/log/nginx:mode=1777
    labels:
      - 'com.barthez.service=portfolio-web'
      - 'com.barthez.version=${IMAGE_TAG:-latest}'
      - 'com.centurylinklabs.watchtower.enable=true'
    networks:
      - portfolio

  # Optional: auto-pull newer GHCR images for barthez-portfolio-web
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: barthez-portfolio-watchtower
    restart: unless-stopped
    profiles: ['watchtower']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_CONFIG_JSON:-~/.docker/config.json}:/config.json:ro
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-300}
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_INCLUDE_RESTARTING=true
    command: barthez-portfolio-web
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.10'
    security_opt:
      - no-new-privileges:true
    networks:
      - portfolio

networks:
  portfolio:
    name: barthez-portfolio-net
    driver: bridge
