# =============================================================================
# Production VPS - pull-only (Nginx Proxy Manager + GHCR + Watchtower)
# Copy this file to the server as docker-compose.yml
#
# NPM proxy host:
#   Domain: barthez-kenwou.dev
#   Forward hostname: barthez-portfolio-web
#   Forward port: 8080
#   Network: web-proxy (external, shared with nginx-proxy-manager)
# =============================================================================

name: barthez-kenwou-portfolio

services:
  web:
    image: ${GHCR_IMAGE:-ghcr.io/barthez-kenwou/barthez-kenwou-porfolio}:${IMAGE_TAG:-latest}
    container_name: barthez-portfolio-web
    restart: unless-stopped
    # Reachable only on Docker networks - NPM terminates TLS on web-proxy
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /tmp/nginx:mode=1777
      - /var/log/nginx:mode=1777
    labels:
      - 'com.barthez.service=portfolio-web'
      - 'com.barthez.version=${IMAGE_TAG:-latest}'
      - 'com.centurylinklabs.watchtower.enable=true'
    networks:
      - portfolio
      - web-proxy

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: barthez-portfolio-watchtower
    restart: unless-stopped
    profiles: ['watchtower']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_CONFIG_JSON:-~/.docker/config.json}:/config.json:ro
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-300}
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_INCLUDE_RESTARTING=true
    command: barthez-portfolio-web
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.10'
    security_opt:
      - no-new-privileges:true
    networks:
      - portfolio

networks:
  portfolio:
    name: barthez-portfolio-net
    driver: bridge
  web-proxy:
    external: true
