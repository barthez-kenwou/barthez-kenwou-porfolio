# =============================================================================
# Barthez Kenwou Portfolio - Nginx (SPA) on :8080
# TLS terminates at the edge (Caddy / Traefik / OVH reverse proxy).
# =============================================================================

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Temp paths compatible with read_only rootfs + tmpfs mounts
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2
        application/manifest+json;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Content-Security-Policy
    # Must be a single-line header value: multi-line values can break some clients/wget parsing.
    # Hashes cover the inline theme bootstrap script in index.html.
    # Cloudflare Insights beacon (static.cloudflareinsights.com) and GTM are whitelisted explicitly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' 'sha256-Y5DkzDSkKEN0lVZBOszkzzqDGkjpKH2LFz9cE0TXoBY=' 'sha256-K5rmwFT4aDEKKYlA2IPWldX2O15tLcdtDrNlz1MXzPM=' 'sha256-7moKog8KBPupO/tN7luIKy5iaAqA9/Rz+sXzLrdOKAM=' 'sha256-ZLJNTOb/YTmraMl6jSvPQYToEV1Y6rVlj4QgseWqigA=' https://www.googletagmanager.com https://analytics.zenora360.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com https://cdn.fontshare.com; font-src 'self' https://fonts.gstatic.com https://cdn.fontshare.com data:; img-src 'self' data: blob: https: https://*.supabase.co https://cdn.jsdelivr.net https://cdn.simpleicons.org https://jebiwuygwtpmdnhhzsbw.supabase.co https://s3.zenora360.com; connect-src 'self' https://api.barthez-kenwou.dev https://s3.zenora360.com https://*.zenora360.com https://*.supabase.co https://analytics.zenora360.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://cdn.simpleicons.org https://cdn.jsdelivr.net; frame-src 'self' https://player.vimeo.com https://vimeo.com https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

    # Health probe (Docker HEALTHCHECK / compose / Watchtower-adjacent)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # RFC 9116 security.txt + other well-known assets (must precede dotfile deny)
    location ^~ /.well-known/ {
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        default_type text/plain;
        try_files $uri =404;
    }

    # SEO / AI discovery files - short cache, never SPA-fallback
    location ~* ^/(robots\.txt|humans\.txt|llms\.txt|llms-full\.txt)$ {
        access_log off;
        add_header Cache-Control "public, max-age=3600";
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }

    location ~* ^/(sitemap\.xml|sitemap[^/]*\.xml)$ {
        access_log off;
        add_header Cache-Control "public, max-age=3600";
        default_type application/xml;
        charset utf-8;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        access_log off;
        add_header Cache-Control "public, max-age=3600";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Hashed Vite assets - long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|mjs|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Never cache the SPA shell
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
